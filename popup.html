<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; background: #1c1c1e; color: #f5f5f5; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    p { margin: 0 0 10px; color: #aaa; font-size: 12px; }
    input { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #444; border-radius: 8px; background: #2c2c2e; color: inherit; }
    button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #0095f6; color: #fff; font-weight: 600; cursor: pointer; }
    #err { margin-top: 6px; color: #ff6b6b; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Reel Finder</h1>
  <p>Paste a reel or post link. It opens on Instagram and finds its spot in the creator's grid.</p>
  <form id="f">
    <input id="url" placeholder="https://www.instagram.com/reel/…" autofocus>
    <button type="submit">Find in profile</button>
  </form>
  <div id="err"></div>
  <script src="shortcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
