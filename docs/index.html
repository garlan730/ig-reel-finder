<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Finder</title>
  <link rel="icon" href="icon128.png">
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --muted: #555; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #eee; --muted: #aaa; --accent: #60a5fa; } }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, sans-serif; }
    main { max-width: 600px; margin: 0 auto; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { margin: 12px 0 4px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <img src="icon128.png" alt="">
  <h1>Reel Finder</h1>
  <p>Found a "Part 1" reel? Reel Finder scrolls the creator's profile for you, highlights that reel in their grid, and shows what they posted right after it, which is usually Part 2.</p>
  <p><a href="privacy.html">Privacy policy</a> · Not affiliated with Instagram or Meta.</p>
</main>
</body>
</html>
